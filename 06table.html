<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>
    <style>
        table{
            width: 100%;
            border-collapse:collapse;
        }
        th,td{
            border:1px solid black;
            padding: 8px;
            text-align: left;
        }
        th{
            background-color: #6a0b0b;
            color:white;
        }
    </style>
</head>
<body>
    <h1>Students Grade Table</h1>
    <hr>
    <table>
        <!--table head= THEAD-->
        <thead>
            <tr>
                <th>name</th>
                <th>subject</th>
                <th>grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>emmanuel</td>
                <td>math</td>
                <td>a++</td>
            </tr>
            <tr>
                <td>john</td>
                <td>english</td>
                <td>a+</td>
            </tr>
             <tr>
                <td>chris</td>
                <td>science</td>
                <td>b+</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
